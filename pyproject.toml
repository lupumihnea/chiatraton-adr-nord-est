[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chiatraton-api"
version = "1.0.0"
description = "Contract-first FastAPI boundary for ChIAtraton."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "PyJWT>=2.9,<3.0",
  "python-multipart>=0.0.12,<1.0",
  "uvicorn>=0.32,<1.0",
]

[project.optional-dependencies]
ai = [
  "httpx>=0.27,<1.0",
  "numpy>=1.26,<3.0",
  "opendataloader-pdf>=2.0,<3.0",
  "openpyxl>=3.1,<4.0",
  "pymupdf>=1.24,<2.0",
  "python-docx>=1.1,<2.0",
  "sentence-transformers>=3.0,<6.0",
  "xlrd>=2.0,<3.0",
]
ui = [
  "httpx>=0.27,<1.0",
  "nicegui>=3.16,<4.0",
]
test = [
  "httpx>=0.27,<1.0",
  "jsonschema>=4.23,<5.0",
  "openapi-spec-validator>=0.7,<1.0",
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "PyYAML>=6.0,<7.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "Interface*", "AI*"]

[tool.setuptools.package-data]
Interface = ["Assets/*.png"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
