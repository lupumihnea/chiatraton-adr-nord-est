          items:
            type: string
            format: uuid

    AnalysisJobCreate:
      type: object
      additionalProperties: false
      properties:
        projectDocumentIds:
          type: array
          uniqueItems: true
          maxItems: 100
          default: []
          items:
            type: string
            format: uuid

        previousReportIds:
          type: array
          uniqueItems: true
          maxItems: 100
          default: []
          items:
            type: string
            format: uuid

    AnalysisJobKind:
      type: string
      enum: [analyze_report, extract_criteria]

    AnalysisJobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]

    AnalysisJobError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
        message:
          type: string
          minLength: 1
          maxLength: 500

    AnalysisJob:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - kind
        - reportId
        - status
        - documentIds
        - projectDocumentIds
        - previousReportIds
        - criteriaSnapshotVersion
        - proposalCount
        - createdAt
        - startedAt
        - completedAt
        - error
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/AnalysisJobKind'
        reportId:
          type: [string, 'null']
          format: uuid
        status:
          $ref: '#/components/schemas/AnalysisJobStatus'
        documentIds:
          type: array
          uniqueItems: true
          maxItems: 100
          items:
            type: string
            format: uuid
        projectDocumentIds:
          type: array
          uniqueItems: true
          maxItems: 100
          items:
            type: string
            format: uuid
        previousReportIds:
          type: array
          uniqueItems: true
          maxItems: 100
          items:
            type: string
            format: uuid
        criteriaSnapshotVersion:
          type: [integer, 'null']
          minimum: 1
        proposalCount:
          type: [integer, 'null']
          minimum: 0
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        error:
          oneOf:
            - $ref: '#/components/schemas/AnalysisJobError'
            - type: 'null'
      allOf:
        - if:
            properties:
              kind:
                const: extract_criteria
            required: [kind]
          then:
            properties:
              reportId:
                type: 'null'
              documentIds:
                minItems: 1
              projectDocumentIds:
                maxItems: 0
              previousReportIds:
                maxItems: 0
              criteriaSnapshotVersion:
                type: 'null'
        - if:
            properties:
              kind:
                const: analyze_report
            required: [kind]
          then:
            properties:
              reportId:
                type: string
                format: uuid
              documentIds:
                maxItems: 0
              criteriaSnapshotVersion:
                type: integer
                minimum: 1
              proposalCount:
                type: 'null'
        - if:
            properties:
              kind:
                const: extract_criteria
              status:
                const: succeeded
            required: [kind, status]
          then:
            properties:
              proposalCount:
                type: integer
                minimum: 0

    CriterionProposalReviewAction:
      type: string
      enum: [accept, correct, reject]

    CriterionProposalCorrection:
      type: object
      additionalProperties: false
      required: [code, description, sourceAnchors]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 4000
        deadline:
          type: [string, 'null']
          format: date
        sourceAnchors:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SourceAnchor'

    CriterionProposalReview:
      type: object
      additionalProperties: false
      required: [proposalId, proposalRevision, action]
      properties:
        proposalId:
          type: string
          format: uuid
        proposalRevision:
          type: integer
          minimum: 1
        action:
          $ref: '#/components/schemas/CriterionProposalReviewAction'
        correction:
          $ref: '#/components/schemas/CriterionProposalCorrection'
        comment:
          type: string
          minLength: 1
          maxLength: 4000
      allOf:
        - if:
            properties:
              action:
                const: correct
            required: [action]
          then:
            required: [correction, comment]
          else:
            properties:
              correction: false
        - if:
            properties:
              action:
                const: reject
            required: [action]
          then:
            required: [comment]

    CriterionProposalReviewBatch:
      type: object
      additionalProperties: false
      required: [reviews]
