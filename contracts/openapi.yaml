        - proposalId
        - proposalRevision
        - action
        - correction
        - comment
        - createdCriterion
        - reviewedBy
        - reviewedAt
      properties:
        id:
          type: string
          format: uuid
        proposalId:
          type: string
          format: uuid
        proposalRevision:
          type: integer
          minimum: 1
        action:
          $ref: '#/components/schemas/CriterionProposalReviewAction'
        correction:
          oneOf:
            - $ref: '#/components/schemas/CriterionProposalCorrection'
            - type: 'null'
        comment:
          type: [string, 'null']
          maxLength: 4000
        createdCriterion:
          oneOf:
            - $ref: '#/components/schemas/Criterion'
            - type: 'null'
        reviewedBy:
          type: string
          minLength: 1
          maxLength: 255
        reviewedAt:
          type: string
          format: date-time
      allOf:
        - if:
            properties:
              action:
                enum: [accept, correct]
            required: [action]
          then:
            properties:
              createdCriterion:
                $ref: '#/components/schemas/Criterion'
        - if:
            properties:
              action:
                const: reject
            required: [action]
          then:
            properties:
              createdCriterion:
                type: 'null'

    CriterionProposal:
