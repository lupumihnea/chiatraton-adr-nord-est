openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: ChIAtraton HTTP API
  version: 1.0.0
  summary: Contractul API pentru workspace-ul de verificare AI.
  description: |
    API contract-first pentru verificarea unui raport periodic selectat.
    ChIAtraton nu înlocuiește MyADR/MySMIS și nu execută acțiuni oficiale.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Originea mediului în care este publicat API-ul.
tags:
  - name: Health
    description: Disponibilitatea minimală și publică a serviciului.
  - name: Projects
    description: Proiecte și calendarul lor contractual de monitorizare.
  - name: Documents
    description: Documente încărcate în limitele unui proiect.
  - name: Criteria
    description: Criterii versionate ale proiectului.
  - name: Criterion extraction
    description: Extracție asincronă de propuneri și review uman auditabil.
  - name: Reports
    description: Rapoarte periodice și asocierile lor de documente.
  - name: Analysis
    description: Joburi asincrone de analiză AI.
  - name: Validations
    description: Propuneri AI per criteriu și decizii finale ale utilizatorului.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Verifică starea minimală a serviciului.
      security: []
      responses:
        '200':
          description: Serviciul răspunde.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects:
    post:
      tags: [Projects]
      operationId: createProject
      summary: Creează un proiect.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Proiect creat.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Projects]
      operationId: listProjects
      summary: Listează proiectele.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Pagină de proiecte.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{projectId}/documents:
    post:
      tags: [Documents]
      operationId: uploadProjectDocument
      summary: Încarcă un document al proiectului.
      description: Acceptă PDF, DOC, DOCX, XLS și XLSX, maximum 50 MiB.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUpload'
      responses:
        '201':
          description: Document încărcat.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Documents]
      operationId: listProjectDocuments
      summary: Listează documentele proiectului.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Pagină de documente.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocuments'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/documents/{documentId}/content:
    get:
      tags: [Documents]
      operationId: getDocumentContent
      summary: Descarcă conținutul binar al unui document.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Conținutul documentului.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{projectId}/criteria:
    post:
      tags: [Criteria]
      operationId: createProjectCriterion
      summary: Creează un criteriu al proiectului.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriterionCreate'
      responses:
        '201':
          description: Criteriu creat.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Criterion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Criteria]
      operationId: listProjectCriteria
      summary: Listează criteriile proiectului.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Pagină de criterii.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCriteria'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{projectId}/criterion-extraction-jobs:
    post:
      tags: [Criterion extraction]
      operationId: createCriterionExtractionJob
      summary: Pornește extracția asincronă a propunerilor de criterii.
      description: |
        AI-ul generează numai CriterionProposal. Operația nu creează Criterion și
        nu șterge sau înlocuiește criteriile existente ale proiectului.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriterionExtractionJobCreate'
      responses:
        '202':
          description: Extracția a fost acceptată în coadă.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AIUnavailable'

  /api/v1/projects/{projectId}/reports:
    post:
      tags: [Reports]
      operationId: createProjectReport
      summary: Creează un raport periodic și asociază documentele sale.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
      responses:
        '201':
          description: Raport creat.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Reports]
      operationId: listProjectReports
      summary: Listează rapoartele proiectului.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Pagină de rapoarte.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReports'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/reports/{reportId}/analysis-jobs:
    post:
      tags: [Analysis]
      operationId: createReportAnalysisJob
      summary: Pornește analiza asincronă a raportului.
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisJobCreate'
      responses:
        '202':
          description: Analiza a fost acceptată în coadă.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AIUnavailable'

  /api/v1/analysis-jobs/{jobId}:
    get:
      tags: [Analysis]
      operationId: getAnalysisJob
      summary: Citește starea unui job de analiză.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Starea jobului.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/criterion-extraction-jobs/{jobId}/proposals:
    get:
      tags: [Criterion extraction]
      operationId: listCriterionExtractionProposals
      summary: Listează propunerile produse de un job de extracție finalizat.
      description: |
        Returnează 409 invalid_analysis_job_kind pentru alt tip de job și
        409 analysis_job_not_succeeded dacă extracția nu s-a încheiat cu succes.
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Pagină de propuneri, inclusiv review-ul lor când există.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCriterionProposals'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/criterion-extraction-jobs/{jobId}/proposal-reviews:
    post:
      tags: [Criterion extraction]
      operationId: createCriterionProposalReviews
      summary: Salvează review-uri umane pentru propunerile jobului.
      description: |
        Batch-ul este atomic. accept și correct creează câte un Criterion nou;
        reject păstrează propunerea și review-ul, fără să creeze Criterion.
        Conflictele folosesc proposal_already_reviewed, stale_proposal_revision,
        criterion_code_conflict sau idempotency_conflict.
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriterionProposalReviewBatch'
      responses:
        '201':
          description: Review-urile au fost salvate și sunt auditabile.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriterionProposalReviewBatchResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/reports/{reportId}/validations:
    get:
      tags: [Validations]
      operationId: listReportValidations
      summary: Listează validările raportului.
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IncludeHistory'
      responses:
        '200':
          description: Pagină de validări.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedValidations'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/validations/{validationId}/decisions:
    post:
      tags: [Validations]
      operationId: createValidationDecision
      summary: Salvează decizia finală a utilizatorului.
      description: Nu pornește un flux oficial de clarificare în MyADR/MySMIS.
      parameters:
        - $ref: '#/components/parameters/ValidationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDecisionCreate'
      responses:
        '201':
          description: Decizie salvată.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDecision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Tokenul identifică utilizatorul tehnic pentru audit.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Cheie opacă pentru replay sigur al operației POST.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ValidationId:
      name: validationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opac returnat de pagina precedentă.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    IncludeHistory:
      name: includeHistory
      in: query
      required: false
      description: Include toate reviziile, nu doar ultima per criteriu.
      schema:
        type: boolean
        default: false

  headers:
    Location:
      description: URI-ul resursei create.
      schema:
        type: string
        format: uri-reference
    IdempotencyReplayed:
      description: Este true numai când răspunsul este un replay idempotent.
      required: false
      schema:
        type: boolean
    RequestId:
      description: Identificator opac pentru corelarea tehnică a cererii.
      schema:
        type: string
        minLength: 1
        maxLength: 128

  responses:
    Unauthorized:
      description: Token absent sau invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resursa nu există sau nu este vizibilă utilizatorului.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflict de stare, idempotency sau unicitate.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PayloadTooLarge:
      description: Fișierul depășește 50 MiB.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnsupportedMediaType:
      description: Tipul fișierului nu este acceptat.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationError:
      description: Request invalid semantic sau structural.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalError:
      description: Eroare internă fără date sensibile.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AIUnavailable:
      description: Serviciul AI nu este disponibil pentru pornirea analizei.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Limita tehnică de cereri a fost depășită.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: chiatraton-api
        version:
          type: string
          minLength: 1

    ProjectCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        smisCode:
          description: Codul SMIS din șase cifre, dacă proiectul provine din MySMIS/MyADR.
          anyOf:
            - type: string
              pattern: '^[0-9]{6}$'
            - type: 'null'
        fundingCallId:
          description: Identificatorul numeric al apelului de finanțare, dacă este disponibil.
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
        beneficiaryName:
          description: Numele beneficiarului, păstrat ca metadată de proiect.
          anyOf:
            - type: string
              minLength: 1
              maxLength: 200
            - type: 'null'

    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - smisCode
        - fundingCallId
        - beneficiaryName
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        smisCode:
          anyOf:
            - type: string
